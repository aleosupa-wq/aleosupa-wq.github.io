<style id="css">
/* Layout: escena axonométrica (reconstrucción) con la obra flotando como paneles proyectados; debajo, índice disperso en mono, catálogo y "sobre mí". Un solo mundo claro, por decisión. */
:root{
  --paper:#F3F2EE;
  --ink:#121212;
  --line:#B9B8B2;
  --faint:#DAD9D3;
  --mute:#7A7973;
  --blue:#1E1BFF;
  --red:#B8332A;
  --f-sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Reenie Beanie","Comic Sans MS",cursive;
  --gut:clamp(16px,3vw,40px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;padding-inline:var(--gut);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--blue);outline-offset:3px}
.m{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;line-height:1.35;font-variant-numeric:tabular-nums}
.cap{font-family:var(--f-sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.u{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}
.u:focus-visible{outline:1px solid var(--blue)}
.u.red{color:var(--red)} .u.blue{color:var(--blue)}

.bar{display:flex;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap;align-items:baseline}
.bar-r{display:flex;gap:16px;align-items:baseline}
.lang{display:flex;gap:10px}
.lang button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;color:var(--line)}
.lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lang button:focus-visible{outline:1px solid var(--blue)}

/* escena */
.stage{position:relative;height:clamp(560px,84vh,880px);margin-inline:calc(var(--gut) * -1);overflow:hidden;cursor:crosshair;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title{position:absolute;left:0;right:0;top:clamp(8px,3vh,28px);text-align:center;z-index:30;pointer-events:none;padding-inline:16px}
.title h1{margin:0;font-weight:500;font-size:clamp(19px,2.3vw,30px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.title p{margin:6px 0 0}
.panel{position:absolute;left:0;top:0;width:220px;height:150px;transform-origin:0 0;border:0;padding:0;cursor:pointer;background:#2a2a2a;overflow:hidden;will-change:transform;box-shadow:0 0 0 .5px rgba(18,18,18,.55);transition:opacity .35s ease}
.panel .tex{position:absolute;inset:0;filter:grayscale(1) contrast(1.3);background-size:cover;background-position:center;transition:filter .4s ease}
.panel.has-img .tex{filter:grayscale(1) contrast(1.08)}
.panel:hover .tex,.panel:focus-visible .tex{filter:none}
.panel .pc,.panel .ps{position:absolute;font-family:var(--f-mono);font-size:10px;color:#F3F2EE;letter-spacing:.04em;text-shadow:0 0 4px rgba(0,0,0,.85)}
.panel .pc{left:8px;top:7px} .panel .ps{right:8px;bottom:7px}
.panel:focus-visible{outline:2px solid var(--blue);outline-offset:0}
.stage.dim .panel:not(.hot){opacity:.42}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;text-align:center;z-index:25;transition:color .2s}
.plabel.on{color:var(--blue)}

.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:flex-end;gap:6px;padding:7px 9px;background:rgba(243,242,238,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:.5px solid var(--line);border-radius:14px;max-width:calc(100% - 32px);overflow-x:auto}
.dk{all:unset;cursor:pointer;position:relative;width:38px;height:38px;border-radius:8px;flex:0 0 auto;transform-origin:50% 100%;transition:transform .12s ease;overflow:hidden;background:#333}
.dk .tex{position:absolute;inset:0;filter:grayscale(1) contrast(1.3);background-size:cover;background-position:center}
.dk span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;color:#F3F2EE;text-shadow:0 0 4px rgba(0,0,0,.9);letter-spacing:.04em}
.dk.blue{background:var(--blue)} .dk.blue span{text-shadow:none}
.dk:focus-visible{outline:1px solid var(--blue);outline-offset:2px}
.sep{width:.5px;height:30px;background:var(--line);align-self:center;flex:0 0 auto}
.tip{position:absolute;bottom:68px;left:0;transform:translateX(-50%);z-index:41;pointer-events:none;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:4px;white-space:nowrap}
.coords{position:absolute;left:var(--gut);bottom:22px;z-index:30;pointer-events:none;color:var(--line)}
.hint{position:absolute;right:var(--gut);bottom:22px;z-index:30;pointer-events:none;color:var(--line);text-align:right}
@media (max-width:760px){.coords,.hint{display:none}.dock{bottom:12px}}

/* índice disperso */
.index{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;row-gap:46px;padding-block:96px 110px}
.ix{all:unset;cursor:pointer;display:block;max-width:24ch}
.ix .n{margin-right:12px}
.ix:hover,.ix:focus-visible{color:var(--blue)}
.ix:focus-visible{outline:1px solid var(--blue);outline-offset:4px}
.ix .sub{display:block;padding-left:3.2em;white-space:pre-line;color:var(--mute)}
.ix:hover .sub{color:inherit}
@media (max-width:760px){.index{grid-template-columns:repeat(6,minmax(0,1fr));row-gap:34px}.ix{grid-column:var(--cm) / span 5 !important}}

/* catálogo */
.cat{border-top:.5px solid var(--line);padding-block:28px 72px}
.cat-h{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:90px 52px minmax(0,1.4fr) minmax(0,1fr) 70px;gap:16px;align-items:center;padding-block:9px;border-bottom:.5px solid var(--faint);width:100%}
.row:hover,.row:focus-visible{color:var(--blue)}
.row .th{width:52px;height:36px;background:#3a3a3a center/cover;filter:grayscale(1)}
.row:hover .th{filter:none}
@media (max-width:700px){.row{grid-template-columns:52px minmax(0,1fr) 54px}.row .c1,.row .c4{display:none}}

/* sobre mí */
.about{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);padding-block:40px 80px;border-top:.5px solid var(--line)}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr)}}
.about h2{margin:0 0 18px;font-weight:500;font-size:clamp(24px,3vw,34px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.about .bio{max-width:58ch;margin:0 0 28px;white-space:pre-line}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;background:#3a3a3a;overflow:hidden}
.photo .tex{position:absolute;inset:0;filter:grayscale(1) contrast(1.15);background-size:cover;background-position:center}
.photo .m{position:absolute;left:10px;bottom:9px;color:#F3F2EE;text-shadow:0 0 4px rgba(0,0,0,.85)}
.edu-h{margin:0 0 14px;font-weight:500;font-size:clamp(20px,2.2vw,26px);text-transform:uppercase;line-height:1}
.edu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;margin-bottom:42px}
.edu div{display:grid;gap:6px;min-width:0}
.edu .yr{font-size:9.5px;color:var(--mute)}
.links{display:flex;gap:18px;flex-wrap:wrap}
.links .lk{color:var(--red);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px;overflow-wrap:anywhere}
.right-col{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}

footer{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:24px 36px;border-top:.5px solid var(--line)}
.fine{color:#8b8a83}
#barcode{width:150px;height:44px;display:block;max-width:100%}

/* hojas */
.overlay{position:fixed;inset:0;z-index:100;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 40px)}
.ov-top{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:clamp(32px,7vh,80px)}
.ov-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px)}
@media (max-width:860px){.ov-grid{grid-template-columns:minmax(0,1fr)}}
.ov h2{margin:0 0 16px;font-weight:500;font-size:clamp(30px,5vw,58px);line-height:.95;text-transform:uppercase;letter-spacing:-.02em;text-wrap:balance}
.ov .desc{max-width:52ch;margin:0 0 28px}
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 18px}
@media (max-width:520px){.works{grid-template-columns:minmax(0,1fr)}}
.wk{all:unset;cursor:pointer;display:grid;gap:8px;min-width:0}
.wk .fr{position:relative;aspect-ratio:4/3;max-width:100%;background:#3a3a3a center/cover;overflow:hidden;filter:grayscale(1) contrast(1.05);transition:filter .35s}
.wk:hover .fr,.wk:focus-visible .fr{filter:none}
.wk:focus-visible{outline:1px solid var(--blue);outline-offset:4px}
.wk.free{cursor:default}
.wk.free .fr .tex{position:absolute;inset:0;filter:grayscale(1) contrast(1.3)}
.note{font-family:var(--f-hand);color:var(--blue);font-size:26px;line-height:.9;transform:rotate(-3deg);display:inline-block}
.rlist{display:grid;gap:22px}
.rlist div{display:grid;gap:4px}
.rlist b{font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:-.005em}

/* visor de obra */
.wv-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start}
@media (max-width:900px){.wv-grid{grid-template-columns:minmax(0,1fr)}}
.wv-img{position:relative;background:#e6e5e0;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden}
.wv-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.wv-img .empty{color:var(--mute)}
.wv-nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{all:unset;cursor:pointer;width:46px;height:34px;background:#3a3a3a center/cover;filter:grayscale(1);opacity:.7}
.thumbs button[aria-pressed="true"]{filter:none;opacity:1;outline:1px solid var(--ink);outline-offset:2px}
.facts{border-top:.5px solid var(--ink);margin:18px 0 22px}
.fr-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding-block:8px;border-bottom:.5px solid var(--faint)}
.wv-text{white-space:pre-line;max-width:56ch;margin:0}

/* editor */
.edit-btn{color:var(--red)}
.editor{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:200;background:var(--paper);border-left:.5px solid var(--ink);display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(18,18,18,.08)}
.ed-head{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;border-bottom:.5px solid var(--line);display:grid;gap:10px}
.ed-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meter{height:2px;background:var(--faint);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.meter.warn i{background:var(--red)}
.tabs{display:flex;gap:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--mute);padding-block:2px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom:1px solid var(--ink)}
.tabs button:focus-visible{outline:1px solid var(--blue)}
.ed-body{flex:1;overflow:auto;padding:16px 18px 40px;display:grid;gap:18px;align-content:start}
.save{all:unset;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;padding:7px 12px}
.save[disabled]{opacity:.35;cursor:default}
.save:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.msg{min-height:14px}
.msg.err{color:var(--red)} .msg.ok{color:var(--blue)}
.fld{display:grid;gap:5px}
.fld label,.fld .lb{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
.bi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ed-in{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:transparent;border:0;border-bottom:.5px solid var(--ink);padding:5px 0;width:100%;border-radius:0;min-width:0}
textarea.ed-in{resize:vertical;min-height:84px;line-height:1.45;border:.5px solid var(--line);padding:7px}
.ed-in:focus{outline:none;border-color:var(--blue)}
select.ed-in{appearance:auto}
.card{border:.5px solid var(--line);padding:12px;display:grid;gap:12px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .it{position:relative;width:78px}
.imgs .it div{width:78px;height:58px;background:#3a3a3a center/cover}
.imgs .it .acts{gap:6px;margin-top:3px}
.imgs .it .acts button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:10px}
.drop{border:.5px dashed var(--ink);padding:14px;text-align:center;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--blue);color:var(--blue)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.list-item{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:6px;border-bottom:.5px solid var(--faint)}
.list-item:hover{color:var(--blue)}
.list-item .th{width:44px;height:32px;background:#3a3a3a center/cover}
.recover{color:var(--blue)}
@media (prefers-reduced-motion: reduce){.dk,.panel,.panel .tex,.wk .fr{transition:none}}
</style>

virtual y mundos navegables.","en":"Modelling, virtual scenography and navigable worlds."}},{"code":"INV","name":{"es":"Investigación / OSINT","en":"Research / OSINT"},"desc":{"es":"Reconstrucción a partir de fuentes abiertas y geolocalización.","en":"Reconstruction from open sources and geolocation."}},{"code":"SON","name":{"es":"Sonido y datos","en":"Sound and data"},"desc":{"es":"Voz, sonido y emoción traducidos a diagramas y visuales.","en":"Voice, sound and emotion translated into diagrams and visuals."}},{"code":"ELE","name":{"es":"Electrónica y sensores","en":"Electronics and sensors"},"desc":{"es":"Arduino, sensores, plóter y objeto físico.","en":"Arduino, sensors, plotter and physical object."}},{"code":"MOD","name":{"es":"Moda e imagen","en":"Fashion and image"},"desc":{"es":"Fotografía de moda, publicidad y dirección creativa.","en":"Fashion photography, advertising and creative direction."}}],"obras":[{"id":"o-estructura-profunda","rama":"INS","year":"2026","title":{"es":"Estructura profunda","en":"Deep Structure"},"tech":{"es":"Instalación interactiva en tiempo real: Unity, TouchDesigner + MediaPipe, gramática generativa, voz sintética","en":"Real-time interactive installation: Unity, TouchDesigner + MediaPipe, generative grammar, synthetic voice"},"size":"LED 7,2 × 4,05 m · variable","text":{"es":"Un niño virtual de unos cinco años aprende a hablar delante del público. Una cámara le da ojos: cuando alguien entra, lo mira, le pone un número y lo describe con lo que tiene a mano (una camiseta roja, unas gafas, el pelo rizado). Después lo mete en un grupo. Cuando la persona se va, une sus rasgos a lo que hizo y nace una regla: «la gente de gafas se va rápido». Con el siguiente visitante de gafas, generaliza, predice y, a veces, excluye.\n\nTambién pregunta. Hace preguntas de sí o no y espera: si el visitante asiente con la cabeza, la respuesta se convierte en ley para todo un grupo; si niega, el niño se pone triste. Cuenta los dedos que le enseñan, se equivoca al principio y acierta después. Se ríe, llora si nadie le mira y llama «familia» a quien se queda con él.\n\nNinguna frase está escrita de antemano. La obra parte de la gramática generativa de Noam Chomsky. En Syntactic Structures (1957), una gramática es un sistema finito de reglas que genera, es decir, define de manera explícita, el conjunto infinito de oraciones de una lengua; en Aspects of the Theory of Syntax (1965), Chomsky distingue competencia y actuación y propone que cada oración tiene una estructura profunda y una estructura superficial relacionadas por transformaciones. De ahí el título. En el niño, cada enunciado parte de un árbol completo y las transformaciones (movimiento del interrogativo, inversión del auxiliar, inserción de «do», afijación del tiempo) lo convierten en lo que dice; aplica unas, aplica mal otras y se salta las que aún no domina. Es poco probable que haya oído «goed» a un adulto: lo produce al extender una regla, aunque los modelos conexionistas discuten que haga falta una regla explícita para explicarlo.\n\nLa obra es una traducción artística, no una implementación de la teoría: en Chomsky «generar» no significa producir frases en tiempo real, la estructura profunda pertenece a la Teoría Estándar de 1965 (el Programa Minimalista la eliminó como nivel autónomo en 1995) y el crecimiento del niño está programado, no modela la gramática universal innata. La gramática crece con la experiencia y se guarda en su memoria: las categorías funcionales aparecen poco a poco (según la hipótesis maduracional de Radford, discutida), el habla pasa de dos palabras («What dat?») a oraciones con relativas («You're one of the tall ones dat are like the watch peoples»), omite a veces el sujeto solo en oraciones principales, y los pasados irregulares siguen una curva en U (went, goed, went), con sobrerregularizaciones más frecuentes que en un niño real para que se oigan.\n\nClasificar es una de las primeras cosas que hace un niño. El prejuicio se forma a la vista, por coincidencia, y lo incómodo es reconocer en su gramática el mecanismo con el que también clasifican los adultos. La pieza dialoga con el Reglamento europeo de Inteligencia Artificial (Reglamento (UE) 2024/1689), que desde el 2 de febrero de 2025 prohíbe la categorización biométrica que deduce o infiere raza, opiniones políticas, afiliación sindical, creencias religiosas o filosóficas, o vida u orientación sexual, y el reconocimiento de emociones en el trabajo y la educación. No prohíbe clasificar en general. El niño trabaja en ese margen: clasifica por ropa o pelo, nunca lo prohibido, y a veces lo dice a su manera: «I can't look at some things. Somebody said no.»\n\nAnte él, el adulto oye un idioma que ya habló: el «goed», el «free» por «three». Es la nostalgia de una gramática perdida, sin endulzar: el niño que conmueve es el mismo que excluye.\n\nImágenes: proyección de sala (render 3D en Blender), pantalla LED de 7,2 × 4,05 m en una sala de 16 × 12 m. La pieza está en desarrollo.\n\nDossier completo (texto curatorial, derivaciones, referencias): claude.ai/artifact/JWiKsqQXmncASHoytW1M47","en":"A virtual child of about five learns to speak in front of the audience. A camera gives him eyes: when someone comes in, he looks at them, gives them a number and describes them with what he has at hand (a red t-shirt, glasses, curly hair). Then he puts them in a group. When the person leaves, he joins their traits to what they did and a rule is born: \"the glasses people go away fast\". With the next visitor who wears glasses, he generalises, predicts and sometimes excludes.\n\nHe also asks. He asks yes-or-no questions and waits: if the visitor nods, the answer becomes a law for a whole group; if they shake their head, the child becomes sad. He counts the fingers he is shown, gets it wrong at first and right later. He laughs, cries if nobody looks at him and calls \"family\" whoever stays with him.\n\nNone of his sentences is written in advance. The work starts from Noam Chomsky's generative grammar. In Syntactic Structures (1957), a grammar is a finite system of rules that generates, that is, explicitly defines, the infinite set of sentences of a language; in Aspects of the Theory of Syntax (1965), Chomsky separates competence from performance and proposes that every sentence has a deep structure and a surface structure related by transformations. Hence the title. In the child, every utterance starts from a complete tree and transformations (wh-movement, auxiliary inversion, do-support, tense affixation) turn it into what he says; he applies some, misapplies others and skips those he has not mastered yet. He is unlikely to have heard \"goed\" from an adult: he produces it by extending a rule, although connectionist models dispute that an explicit rule is needed to explain it.\n\nThe work is an artistic translation, not an implementation of the theory: for Chomsky \"generate\" does not mean producing sentences in real time, deep structure belongs to the 1965 Standard Theory (the Minimalist Program eliminated it as an autonomous level in 1995), and the child's growth is programmed rather than modelling innate universal grammar. The grammar grows with experience and is saved in his memory: functional categories appear gradually (following Radford's contested maturational hypothesis), speech moves from two words (\"What dat?\") to clauses with relatives (\"You're one of the tall ones dat are like the watch peoples\"), he sometimes omits the subject only in main clauses, and irregular pasts follow a U-shaped curve (went, goed, went), with over-regularisations more frequent than in a real child so that they can be heard.\n\nSorting is one of the first things a child does. Prejudice forms in plain sight, by coincidence, and what is uncomfortable is recognising in his grammar the mechanism adults use to sort, too. The piece engages with the European Artificial Intelligence Act (Regulation (EU) 2024/1689), which since 2 February 2025 bans biometric categorisation that deduces or infers race, political opinions, trade union membership, religious or philosophical beliefs, or sex life or sexual orientation, as well as emotion recognition in the workplace and education. It does not ban sorting in general. The child works in that margin: he sorts by clothing or hair, never what is banned, and sometimes says so in his own way: \"I can't look at some things. Somebody said no.\"\n\nIn front of him, the adult hears a language they once spoke: the \"goed\", the \"free\" for \"three\". It is nostalgia for a lost grammar, unsweetened: the child who moves you is the same one who excludes.\n\nImages: room projection (3D render in Blender), 7.2 × 4.05 m LED wall in a 16 × 12 m room. Work in progress.\n\nFull dossier (curatorial text, derivations, references): claude.ai/artifact/JWiKsqQXmncASHoytW1M47"},"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAP0BwgDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH86EAAAAAAAAAAAAAAAAAAASggCkWAEmcJZDJjSgAAAAAAUAAAAAABRKJQlBKJQACgAAAAAAEoAiiKIoiwLAAACKIsAAIogABI+g8nT7tnzrPCVKJLAAAAACLAACAAAgAAIAAACLAAAAACLAAAAAAAAQKO0EURRFgAAAAAAAAKRRFCUQAAAAAAAAACUYzMYW4mTGlKRRFEKAAAACkUAAAABQpFEURQAAAAAAAABFEURRFEAAABFEWACURRAJRFgA6eaHu+B6Y81LEWEAAAABAAJYAAJYAACAAACWFgAAAAAIAAAAAABAAB20AAAAAAAIoiiKAAAAAEogAAAAAAAAAAAJMhhcsS3AZpQAAAAUAAACigAAAAUiiKEoAAAAAAShKIoiwAAASiKIACKIsAAIsAIsAHqeXTZo9TzCCJLAAABLAABAAAQAAEAAAQAAAAAELLAAAAAAAAQAoO0AAAAAAAAAAAAAAAAAEoJRKEUSgBKAEUSglEUAMchhNkJcYbGNCiUAAABaAAAKAAABSKIoSiUAJQAAAiiKIogAIoiiAASiLAACAAgAEADPo49pou3TFlhAEpLAAAIAAIAACAAAIAAAAAEAAAAAAAAACUEoB2gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAFMMdsMMmJmwyKoiwKoABZQAAUAAAFIoihKAAAAAAEoiiLABKIsAEoiiASiLACLBKIBLACA26bka0sJYQAABAAAgAAIAABAAAAAAQWAAAAAAAA function unprojFloor(sx,sy){var xr=(sx-CX)/S,zr=(sy-CY)/(S*sP),c=Math.cos(yaw),s=Math.sin(yaw);return{x:xr*c+zr*s,z:-xr*s+zr*c}}
var BOXES=[[-1.6,-1.1,2.4,1.6,.9],[.9,-.6,1.4,2.2,.5],[-.4,1.1,1.2,.9,1.4],[-2.6,.8,.8,.8,.3]];
var PANELS=[];
function buildPanels(){
  var box=$("panels");box.innerHTML="";stage.querySelectorAll(".plabel").forEach(function(l){l.remove()});
  var R=rng(2005);
  PANELS=ITEMS.map(function(it,i){
    var a=i/ITEMS.length*Math.PI*2+.3,rad=4.3+R()*1.2;
    var p={it:it,x:Math.cos(a)*rad,z:Math.sin(a)*rad,y:1.0+R()*1.5,phi:a+Math.PI/2+(R()-.5)*.9,w:1.9,h:1.3,tx:(R()-.5)*2.4,tz:(R()-.5)*2,ty:.2+R()*.8,lift:0};
    var b=document.createElement("button");b.type="button";b.className="panel";
    b.innerHTML='<div class="tex"></div><span class="pc"></span><span class="ps"></span>';
    b.addEventListener("pointerenter",function(){setHover(i)});
    b.addEventListener("pointerleave",function(){setHover(-1)});
    b.addEventListener("focus",function(){setHover(i)});
    b.addEventListener("blur",function(){setHover(-1)});
    b.addEventListener("click",function(){if(moved)return;openItem(it.code)});
    box.appendChild(b);p.el=b;
    var l=document.createElement("div");l.className="plabel cap";stage.appendChild(l);p.lab=l;
    return p;
  });
  refreshPanels();
}
function refreshPanels(){
  PANELS.forEach(function(p){
    var it=p.it,cover=it.kind==="rama"?coverOf(it.code):"";
    paint(p.el.querySelector(".tex"),cover,it.code+"p");
    p.el.classList.toggle("has-img",!!cover);
    var n=it.kind==="rama"?obrasOf(it.code).length:it.kind==="ref"?STATE.refs.length:STATE.tools.length;
    p.el.querySelector(".pc").textContent=it.code+"—"+pad(n,2);
    p.el.querySelector(".ps").textContent=it.kind==="rama"?(n?"●":"○"):"·";
    p.el.setAttribute("aria-label",itemName(it));
  });
}
function setHover(i){hovered=i;stage.classList.toggle("dim",i>=0);PANELS.forEach(function(p,k){p.el.classList.toggle("hot",k===i)});if(reduce){PANELS.forEach(function(p,k){p.lift=k===i?.35:0})}kick()}

function layout(){
  var dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/15,H/11.5);CX=W/2;CY=H*.62;draw();
}
function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function ln(a,b,t){var e=t==null?INTRO:t;var q=lerp(a,b,Math.max(0,Math.min(1,e)));g.moveTo(a.x,a.y);g.lineTo(q.x,q.y)}
function ext(a,b,k){return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}}
var C={};
function readColors(){C={ink:cssVar("--ink"),line:cssVar("--line"),faint:cssVar("--faint"),blue:cssVar("--blue"),paper:cssVar("--paper"),hand:cssVar("--f-hand"),mono:cssVar("--f-mono")}}
readColors();

function draw(){
  g.clearRect(0,0,W,H);g.lineWidth=.6;
  var i,k;
  g.strokeStyle=C.faint;g.beginPath();
  for(i=-6;i<=6;i++){ln(proj(i,0,-6),proj(i,0,6));ln(proj(-6,0,i),proj(6,0,i))}
  g.stroke();
  g.setLineDash([2,4]);g.strokeStyle=C.line;g.beginPath();
  var lim=Math.round(96*INTRO);
  for(k=0;k<=lim;k++){var a=k/96*Math.PI*2;var q=proj(Math.cos(a)*5,0,Math.sin(a)*5);k?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)}
  g.stroke();g.beginPath();
  [[-6,0,-6,6,0,6],[6,0,-6,-6,0,6],[0,0,-7,0,0,7],[-7,0,1,7,0,-1]].forEach(function(v){var A=proj(v[0],v[1],v[2]),B=proj(v[3],v[4],v[5]);ln(ext(B,A,1.6),ext(A,B,1.6))});
  g.stroke();g.setLineDash([]);
  g.strokeStyle=C.ink;g.globalAlpha=.75;g.beginPath();
  BOXES.forEach(function(b){var x=b[0],z=b[1],w=b[2],d=b[3],h=b[4]*Math.min(1,INTRO*1.4);
    var v=[[x,0,z],[x+w,0,z],[x+w,0,z+d],[x,0,z+d],[x,h,z],[x+w,h,z],[x+w,h,z+d],[x,h,z+d]].map(function(p){return proj(p[0],p[1],p[2])});
    [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function(e){ln(v[e[0]],v[e[1]],1)})});
  (function(){var b=BOXES[0],x=b[0],z=b[1],w=b[2],d=b[3],h=b[4]*Math.min(1,INTRO*1.4),rh=h+.7*Math.min(1,INTRO*1.4);var r1=proj(x,rh,z+d/2),r2=proj(x+w,rh,z+d/2);
    ln(r1,r2,1);[[x,z],[x,z+d]].forEach(function(p){ln(proj(p[0],h,p[1]),r1,1)});[[x+w,z],[x+w,z+d]].forEach(function(p){ln(proj(p[0],h,p[1]),r2,1)})})();
  g.stroke();g.globalAlpha=1;
  g.strokeStyle=C.line;g.beginPath();
  (function(){var b=BOXES[2];for(var k=1;k<12;k++){var y=b[4]*k/12*Math.min(1,INTRO*1.4);ln(proj(b[0],y,b[1]),proj(b[0]+b[2],y,b[1]),1)}})();
  g.stroke();

  var order=[];
  PANELS.forEach(function(p,i){
    if(!reduce){p.lift+=((hovered===i?.35:0)-p.lift)*.15}
    var ux=Math.cos(p.phi),uz=Math.sin(p.phi),cx=p.x,cy=p.y+p.lift,cz=p.z;
    function corner(sx,sy){return proj(cx+ux*sx*p.w/2,cy+sy*p.h/2,cz+uz*sx*p.w/2)}
    var tl=corner(-1,1),tr=corner(1,1),bl=corner(-1,-1),br=corner(1,-1),t;
    if((tr.x-tl.x)*(bl.y-tl.y)-(tr.y-tl.y)*(bl.x-tl.x)<0){t=tl;tl=tr;tr=t;t=bl;bl=br;br=t}
    p.el.style.transform="matrix("+(tr.x-tl.x)/220+","+(tr.y-tl.y)/220+","+(bl.x-tl.x)/150+","+(bl.y-tl.y)/150+","+tl.x+","+tl.y+")";
    var op=Math.max(0,Math.min(1,INTRO*1.8-i*.08));
    if(!stage.classList.contains("dim"))p.el.style.opacity=op;else p.el.style.opacity="";
    var c=proj(cx,cy,cz);p.d=c.d;order.push(p);
    var bot=proj(cx,cy-p.h/2,cz);
    p.lab.style.left=bot.x+"px";p.lab.style.top=(Math.max(bl.y,br.y)+8)+"px";p.lab.style.opacity=op;
    p.lab.textContent=itemName(p.it);p.lab.classList.toggle("on",hovered===i);
    var target=proj(p.tx,p.ty,p.tz),floor=proj(cx,0,cz);
    g.strokeStyle=hovered===i?C.blue:C.line;g.globalAlpha=hovered===i?1:.8;g.lineWidth=hovered===i?.9:.5;
    g.beginPath();[tl,tr,bl,br].forEach(function(q){ln(q,target)});g.stroke();
    g.setLineDash([3,3]);g.beginPath();ln(bot,floor);g.stroke();g.setLineDash([]);
    g.beginPath();g.arc(floor.x,floor.y,2,0,Math.PI*2);g.stroke();g.globalAlpha=1;g.lineWidth=.6;
  });
  order.sort(function(a,b){return a.d-b.d}).forEach(function(p,k){p.el.style.zIndex=10+k});

  if(INTRO>.6){
    g.globalAlpha=Math.min(1,(INTRO-.6)/.4);
    g.fillStyle=C.blue;g.strokeStyle=C.blue;g.lineWidth=1;
    g.font=Math.round(Math.max(18,S*.42))+"px "+C.hand;
    var notes=T[lang].notes,anchors=[[2.2,.6,-2.4],[-2.8,1.6,1.8],[0,2.6,0]];
    anchors.forEach(function(a,i){var q=proj(a[0],a[1],a[2]),nx=q.x+(i%2?-1:1)*S*1.3,ny=q.y-S*.9;
      g.beginPath();g.moveTo(nx,ny+4);g.quadraticCurveTo((nx+q.x)/2+8,(ny+q.y)/2+10,q.x,q.y);g.stroke();
      g.beginPath();g.arc(q.x,q.y,3,0,Math.PI*2);g.fill();
      g.save();g.translate(nx,ny);g.rotate(-.05);g.textAlign=i%2?"right":"left";g.fillText(notes[i],0,0);g.restore()});
    if(hovered>=0){var p=PANELS[hovered],q=proj(p.x,p.y+p.lift+p.h/2,p.z);
      g.save();g.translate(q.x+12,q.y-14);g.rotate(-.06);g.fillText("→ "+T[lang].open,0,0);
      g.beginPath();g.ellipse(14,-6,S*.7+10,S*.28+6,0,0,Math.PI*2);g.stroke();g.restore()}
    g.globalAlpha=1;
  }
  if(probe&&!dragging){
    var fp=unprojFloor(probe.x,probe.y);
    if(Math.abs(fp.x)<7&&Math.abs(fp.z)<7){
      var P=proj(fp.x,0,fp.z),ax=proj(fp.x,0,0),az=proj(0,0,fp.z);
      g.strokeStyle=C.blue;g.lineWidth=.6;g.setLineDash([2,3]);g.beginPath();g.moveTo(P.x,P.y);g.lineTo(ax.x,ax.y);g.moveTo(P.x,P.y);g.lineTo(az.x,az.y);g.stroke();g.setLineDash([]);
      g.beginPath();g.moveTo(P.x-6,P.y);g.lineTo(P.x+6,P.y);g.moveTo(P.x,P.y-6);g.lineTo(P.x,P.y+6);g.stroke();
      g.fillStyle=C.blue;g.font="10px "+C.mono;g.textAlign="left";
      g.fillText("x "+fp.x.toFixed(2)+"  z "+fp.z.toFixed(2)+" m",P.x+9,P.y-8);
    }
  }
  $("coords").textContent="yaw "+(((yaw*180/Math.PI)%360+360)%360).toFixed(1).padStart(5,"0")+"° · pitch 30.0° · 1:"+Math.round(1000/S);
}

var dragging=false,moved=false,lastX=0,raf=null,visible=true;
stage.addEventListener("pointerdown",function(e){dragging=true;moved=false;lastX=e.clientX;stage.classList.add("drag")});
addEventListener("pointermove",function(e){
  if(dragging){var dx=e.clientX-lastX;if(Math.abs(dx)>2)moved=true;lastX=e.clientX;yawT+=dx*.006;kick();return}
  if(e.pointerType==="mouse"){var r=stage.getBoundingClientRect();if(e.clientY>=r.top&&e.clientY<=r.bottom){probe={x:e.clientX-r.left,y:e.clientY-r.top};kick()}}
});
stage.addEventListener("pointerleave",function(){probe=null;kick()});
addEventListener("pointerup",function(){dragging=false;stage.classList.remove("drag");setTimeout(function(){moved=false},0)});
function tick(now){
  INTRO=reduce?1:Math.min(1,(now-T0)/1600);
  if(!reduce&&!dragging)yawT+=.0007;
  yaw+=(yawT-yaw)*.12;draw();
  raf=(visible&&(!reduce||Math.abs(yawT-yaw)>.001))?requestAnimationFrame(tick):null;
}
function kick(){if(!raf)raf=requestAnimationFrame(tick)}
new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)kick()}).observe(stage);

/* dock */
function buildDock(){
  var dock=$("dock");dock.innerHTML="";
  ITEMS.forEach(function(it,i){
    if(it.kind==="ref"){var s=document.createElement("span");s.className="sep";dock.appendChild(s)}
    var b=document.createElement("button");b.type="button";b.className="dk";b.dataset.code=it.code;
    b.innerHTML='<div class="tex"></div><span>'+esc(it.code)+'</span>';
    paint(b.querySelector(".tex"),it.kind==="rama"?coverOf(it.code):"",it.code+"p");
    b.addEventListener("click",function(){openItem(it.code)});dock.appendChild(b);
  });
  var s=document.createElement("span");s.className="sep";dock.appendChild(s);
  var b=document.createElement("button");b.type="button";b.className="dk blue";b.dataset.code="INFO";b.innerHTML="<span>INFO</span>";
  b.addEventListener("click",function(){$("info").scrollIntoView({behavior:reduce?"auto":"smooth"})});dock.appendChild(b);
}
var dockEl=$("dock"),tip=$("tip");
dockEl.addEventListener("pointermove",function(e){if(reduce)return;dockEl.querySelectorAll(".dk").forEach(function(d){var r=d.getBoundingClientRect(),dist=Math.abs(e.clientX-(r.left+r.width/2));d.style.transform="scale("+(1+Math.max(0,1-dist/110)*.55)+")"})});
dockEl.addEventListener("pointerleave",function(){dockEl.querySelectorAll(".dk").forEach(function(d){d.style.transform=""});tip.hidden=true});
dockEl.addEventListener("pointerover",function(e){var d=e.target.closest(".dk");if(!d)return;var it=ITEMS.find(function(x){return x.code===d.dataset.code});
  tip.textContent=it?itemName(it):T[lang].info;var r=d.getBoundingClientRect(),sr=stage.getBoundingClientRect();tip.style.left=(r.left+r.width/2-sr.left)+"px";tip.hidden=false});

  ITEMS.forEach(function(it,i){
    var b=document.createElement("button");b.type="button";b.className="ix m";

function renderAbout(){
  $("t-about").textContent=T[lang].about;$("bio").textContent=tx(STATE.bio);
  paint($("portrait"),STATE.portrait,"foto");$("t-photo").textContent=STATE.portrait?"":T[lang].photo;$("t-photo").hidden=!!STATE.portrait;$("portrait").parentNode.hidden=!STATE.portrait;

    return '<span class="lk" style="user-select:text">'+esc(c.k)+' — '+v+'</span>';

}
function barcode(){
  var c=$("barcode"),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.fillStyle=C.ink;
  var str=TITLE.toUpperCase(),px=0;
  for(var i=0;i<str.length;i++){var v=str.charCodeAt(i);for(var b=0;b<6;b++){var w=((v>>b)&1)?4:2;if(b%2===0)x.fillRect(px,0,w,c.height);px+=w+1;if(px>c.width)return}}
}

/* hojas */
var lastFocus=null,openOv=null;
function showOv(id){lastFocus=lastFocus||document.activeElement;["ov","wv"].forEach(function(k){$(k).hidden=k!==id});openOv=id;document.body.style.overflow="hidden";var c=$(id).querySelector(".close");if(c)c.focus()}
function closeAll(){$("ov").hidden=true;$("wv").hidden=true;openOv=null;document.body.style.overflow="";if(lastFocus){try{lastFocus.focus()}catch(e){}}lastFocus=null}
var currentItem=null;
function openItem(code){
  var it=ITEMS.find(function(x){return x.code===code});if(!it)return;currentItem=code;
  var idx=ITEMS.indexOf(it),ov=$("ov");
  var body="";
  if(it.kind==="ref"){
    body='<div class="rlist">'+STATE.refs.map(function(r){return '<div><b>'+esc(r.name)+'</b><span class="m">'+esc(tx(r.desc))+'</span></div>'}).join("")+'</div>';
  } else if(it.kind==="her"){
    body='<div class="rlist">'+STATE.tools.map(function(t){return '<div><span class="m" style="color:var(--mute)">'+esc(tx(t.k))+'</span><b>'+esc(tx(t.v))+'</b></div>'}).join("")+'</div>';
  } else {
    body='<div class="works" id="works"></div>';
  }
  var count=it.kind==="rama"?T[lang].works(obrasOf(code).length):it.kind==="ref"?pad(STATE.refs.length,2)+" "+T[lang].refs:"";
  ov.innerHTML='<div class="ov-top"><span class="m">'+esc(code)+' — '+pad(idx+1,2)+'/'+pad(ITEMS.length,2)+'</span><button class="u red close" type="button">'+T[lang].close+'</button></div>'+
    '<div class="ov-grid"><div><h2 id="ov-title">'+esc(itemName(it))+'</h2><p class="desc">'+esc(itemDesc(it))+'</p><p class="m">'+count+'</p></div><div>'+body+'</div></div>';
  ov.querySelector(".close").addEventListener("click",closeAll);
  if(it.kind==="rama"){
    var wk=$("works");
    obrasOf(code).forEach(function(o){
      var b=document.createElement("button");b.type="button";b.className="wk";
      b.innerHTML='<div class="fr"></div><span class="m">'+codeOf(o)+(o.year?" · "+esc(o.year):"")+'<br>'+esc(tx(o.title)||"—")+'</span>';
      var fr=b.querySelector(".fr");if(o.imgs&&o.imgs[0])fr.style.backgroundImage='url("'+o.imgs[0]+'")';else texture(fr,codeOf(o));
      b.addEventListener("click",function(){openWork(o)});wk.appendChild(b);
    });
    var next=code+"-"+pad(obrasOf(code).length+1,3);
    var f=document.createElement("div");f.className="wk free";
    f.innerHTML='<div class="fr"><div class="tex"></div></div><span><span class="note">'+T[lang].slotNote+'</span><br><span class="m">'+next+' · '+T[lang].free+'</span></span>';
    texture(f.querySelector(".tex"),next);wk.appendChild(f);
  }
  showOv("ov");
}
var curWork=null,curImg=0;
function openWork(o,imgIndex){
  curWork=o;curImg=imgIndex||0;
  var list=obrasOf(o.rama),i=list.indexOf(o),L=T[lang],imgs=o.imgs||[],wv=$("wv");
  wv.innerHTML='<div class="ov-top"><span class="m">'+codeOf(o)+' — '+esc(ramaName(o.rama))+'</span><div class="acts" style="display:flex;gap:18px"><button class="u" id="wv-back" type="button">'+esc(ramaName(o.rama))+'</button><button class="u red close" type="button">'+L.close+'</button></div></div>'+
   '<div class="wv-grid"><div><div class="wv-img">'+(imgs.length?'<img alt="'+esc(tx(o.title))+'" src="'+imgs[curImg]+'">':'<span class="m empty">'+L.noimg+'</span>')+'</div>'+
   '<div class="wv-nav"><div class="thumbs">'+(imgs.length>1?imgs.map(function(s,k){return '<button type="button" aria-label="'+(k+1)+'" aria-pressed="'+(k===curImg)+'" data-k="'+k+'" style="background-image:url(&quot;'+s+'&quot;)"></button>'}).join(""):"")+'</div>'+
   '<div style="display:flex;gap:16px">'+(i>0?'<button class="u" id="wv-prev" type="button">'+L.prev+'</button>':'')+(i<list.length-1?'<button class="u" id="wv-next" type="button">'+L.next+'</button>':'')+'</div></div></div>'+
   '<div><h2 id="wv-title">'+esc(tx(o.title)||"—")+'</h2><div class="facts">'+
   [[L.year,o.year],[L.tech,tx(o.tech)],[L.size,o.size],[L.rama,ramaName(o.rama)]].map(function(r){return '<div class="fr-row"><span class="m" style="color:var(--mute)">'+r[0]+'</span><span class="m">'+esc(r[1]||"—")+'</span></div>'}).join("")+
   '</div><p class="wv-text">'+esc(tx(o.text))+'</p></div></div>';
  wv.querySelector(".close").addEventListener("click",closeAll);
  $("wv-back").addEventListener("click",function(){openItem(o.rama)});
  if($("wv-prev"))$("wv-prev").addEventListener("click",function(){openWork(list[i-1])});
  if($("wv-next"))$("wv-next").addEventListener("click",function(){openWork(list[i+1])});
  wv.querySelectorAll(".thumbs button").forEach(function(b){b.addEventListener("click",function(){openWork(o,+b.dataset.k)})});
  showOv("wv");
}
addEventListener("keydown",function(e){
  if(e.key==="Escape"&&openOv){closeAll();return}

var ART=null,dirty=false,tab="obras",editing=null,DRAFT_KEY="aop-draft",publishing=false;
function serialize(){
  var json=JSON.stringify(STATE).replace(/</g,"\\u003c");
  var S_="<"+"/script>";
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+RESET+"</style></head><body>\n"+
    "<title>"+TITLE+"</title>\n"+HEAD_LINKS+"\n<style id=\"css\">"+CSS_SRC+"</style>\n<div id=\"root\"></div>\n"+
    "<script type=\"application/json\" id=\"state\">"+json+S_+"\n<script id=\"app\">"+APP_SRC+S_+"\n</body></html>";
}
function bytes(s){return new Blob([s]).size}
var saveDraftT=null;
function markDirty(){dirty=true;clearTimeout(saveDraftT);saveDraftT=setTimeout(function(){try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(STATE))}catch(e){}},400);scheduleRender();clearTimeout(uhT);uhT=setTimeout(updateHead,300)}
var uhT=null;
var rT=null;function scheduleRender(){clearTimeout(rT);rT=setTimeout(function(){buildItems();renderAll()},180)}
addEventListener("beforeunload",function(e){if(dirty&&!publishing){e.preventDefault();e.returnValue=""}});

function updateHead(){
  var h=$("ed-meter");if(!h)return;
  var b=bytes(serialize()),f=b/MAX_BYTES;
  h.querySelector("i").style.width=Math.min(100,f*100)+"%";h.classList.toggle("warn",f>.85);
  $("ed-size").textContent=(b/1048576).toFixed(2)+" / 16 MB";
  $("ed-save").disabled=!dirty||publishing;
}
function msg(t,kind){var m=$("ed-msg");if(!m)return;m.textContent=t||"";m.className="msg m"+(kind?" "+kind:"")}

function openEditor(){$("editor").hidden=false;renderEditor();closeAll()}
function closeEditor(){$("editor").hidden=true}

function renderEditor(){
  var ed=$("editor");
  ed.innerHTML='<div class="ed-head"><div class="ed-row"><span class="m">'+(lang==="es"?"Modo edición":"Edit mode")+'</span><div class="acts">'+
    '<button class="save" id="ed-save" type="button">'+(lang==="es"?"Guardar y publicar":"Save and publish")+'</button><button class="u" id="ed-close" type="button">'+(lang==="es"?"cerrar":"close")+'</button></div></div>'+
    '<div class="meter" id="ed-meter"><i></i></div><div class="ed-row"><span class="m" id="ed-size" style="color:var(--mute)"></span><span id="ed-msg" class="msg m"></span></div>'+
    '<div class="tabs" role="group">'+[["obras",lang==="es"?"Obras":"Works"],["textos",lang==="es"?"Textos":"Texts"],["ramas",lang==="es"?"Ramas":"Branches"],["refs",lang==="es"?"Referencias":"References"],["tools",lang==="es"?"Herramientas":"Tools"]].map(function(t){return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div></div>'+
    '<div class="ed-body" id="ed-body"></div>';
  ed.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.t;editing=null;renderEditor()})});

/* helpers de formulario */
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}
var uid=0;
function fText(label,obj,key,opts){
  opts=opts||{};var id="f"+(++uid);
  var w=el('<div class="fld"><label for="'+id+'">'+esc(label)+'</label>'+(opts.area?'<textarea class="ed-in" id="'+id+'"></textarea>':'<input class="ed-in" id="'+id+'" type="'+(opts.type||"text")+'" autocomplete="off">')+'</div>');
  var inp=w.querySelector(".ed-in");inp.value=obj[key]||"";if(opts.ph)inp.placeholder=opts.ph;
  inp.addEventListener("input",function(){obj[key]=inp.value;markDirty();if(opts.on)opts.on()});
  return w;
}
function fBi(label,obj,key,area){
  if(!obj[key]||typeof obj[key]!=="object")obj[key]={es:"",en:""};
  var w=el('<div class="fld"><span class="lb">'+esc(label)+'</span><div class="bi"></div></div>');
  var bi=w.querySelector(".bi");
  ["es","en"].forEach(function(l){var f=fText(l.toUpperCase(),obj[key],l,{area:area});bi.appendChild(f)});
  return w;
}
function btn(text,cls,fn){var b=document.createElement("button");b.type="button";b.className="u "+(cls||"");b.textContent=text;b.addEventListener("click",fn);return b}
function confirmBtn(text,fn){
  var b=btn(text,"red",function(){if(b.dataset.armed){fn()}else{b.dataset.armed="1";b.textContent=lang==="es"?"¿seguro? pulsa otra vez":"sure? click again";setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent=text}},3000)}});
  return b;
}

/* imágenes: compresión a JPEG dentro del navegador */
function compress(file,max,q){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)){rej(new Error("type"));return}
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
      var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("load"))};
    img.src=url;
  });
}
function dropZone(label,multiple,onFiles){
  var id="f"+(++uid);
  var z=el('<label class="drop m" for="'+id+'">'+esc(label)+'<input id="'+id+'" type="file" accept="image/*"'+(multiple?" multiple":"")+'></label>');
  var inp=z.querySelector("input");
  inp.addEventListener("change",function(){onFiles(Array.from(inp.files||[]));inp.value=""});
  z.addEventListener("dragover",function(e){e.preventDefault();z.classList.add("over")});
  z.addEventListener("dragleave",function(){z.classList.remove("over")});
  z.addEventListener("drop",function(e){e.preventDefault();z.classList.remove("over");onFiles(Array.from(e.dataTransfer.files||[]))});
  return z;
}
function addImages(files,arr,after){
  if(!files.length)return;
  msg(lang==="es"?"Procesando imágenes…":"Processing images…");
  var jobs=files.map(function(f){return compress(f,1800,.82).then(function(d){arr.push(d)}).catch(function(){})});
  Promise.all(jobs).then(function(){msg("");markDirty();after()});
}

/* pestaña Obras */
function edObras(body){
  if(editing){edObra(body,editing);return}
  body.appendChild(btn(lang==="es"?"+ nueva obra":"+ new work","blue",function(){
    var o={id:"o"+Date.now().toString(36),rama:STATE.ramas[0].code,year:String(new Date().getFullYear()),title:{es:"",en:""},tech:{es:"",en:""},size:"",text:{es:"",en:""},imgs:[]};
    STATE.obras.push(o);editing=o;markDirty();renderEditor();
  }));
  if(!STATE.obras.length){body.appendChild(el('<p class="m" style="color:var(--mute)">'+(lang==="es"?"Todavía no hay obras. Pulsa «nueva obra» para dar de alta la primera.":"No works yet. Click “new work” to add the first one.")+'</p>'));return}
  STATE.ramas.forEach(function(r){
    var list=obrasOf(r.code);if(!list.length)return;
    body.appendChild(el('<span class="m" style="color:var(--mute)">'+esc(r.code)+' — '+esc(tx(r.name))+'</span>'));
    var box=document.createElement("div");
    list.forEach(function(o){
      var b=document.createElement("button");b.type="button";b.className="list-item m";
      b.innerHTML='<span class="th"></span><span>'+codeOf(o)+' · '+esc(tx(o.title)||"—")+'</span><span>'+(lang==="es"?"editar":"edit")+'</span>';
      var th=b.querySelector(".th");if(o.imgs&&o.imgs[0])th.style.backgroundImage='url("'+o.imgs[0]+'")';else texture(th,codeOf(o));
      b.addEventListener("click",function(){editing=o;renderEditor()});box.appendChild(b);
    });
    body.appendChild(box);
  });
}
function edObra(body,o){
  var head=el('<div class="card-h"><span class="m">'+codeOf(o)+'</span><div class="acts"></div></div>');
  head.querySelector(".acts").appendChild(btn(lang==="es"?"← lista":"← list","",function(){editing=null;renderEditor()}));
  head.querySelector(".acts").appendChild(btn(lang==="es"?"ver":"view","blue",function(){openWork(o)}));
  head.querySelector(".acts").appendChild(confirmBtn(lang==="es"?"eliminar":"delete",function(){STATE.obras.splice(STATE.obras.indexOf(o),1);editing=null;markDirty();renderEditor()}));
  body.appendChild(head);
  var sel=el('<div class="fld"><label for="f-rama">'+(lang==="es"?"Rama":"Branch")+'</label><select class="ed-in" id="f-rama">'+STATE.ramas.map(function(r){return '<option value="'+esc(r.code)+'"'+(r.code===o.rama?" selected":"")+'>'+esc(r.code)+' — '+esc(tx(r.name))+'</option>'}).join("")+'</select></div>');
  sel.querySelector("select").addEventListener("change",function(e){o.rama=e.target.value;markDirty();renderEditor()});
  body.appendChild(sel);
  body.appendChild(fBi(lang==="es"?"Título":"Title",o,"title"));
  var two=el('<div class="bi"></div>');two.appendChild(fText(lang==="es"?"Año":"Year",o,"year"));two.appendChild(fText(lang==="es"?"Medidas":"Dimensions",o,"size",{ph:"100 × 81 cm"}));body.appendChild(two);
  body.appendChild(fBi(lang==="es"?"Técnica":"Technique",o,"tech"));
  body.appendChild(fBi(lang==="es"?"Texto":"Text",o,"text",true));
  var imgBox=el('<div class="fld"><span class="lb">'+(lang==="es"?"Imágenes (la primera es la portada)":"Images (the first is the cover)")+'</span><div class="imgs"></div></div>');
  var imgs=imgBox.querySelector(".imgs");
  (o.imgs||[]).forEach(function(src,k){
    var it=el('<div class="it"><div></div><div class="acts"></div></div>');it.firstChild.style.backgroundImage='url("'+src+'")';
    var a=it.querySelector(".acts");
    if(k>0)a.appendChild(btnS("←",function(){var t=o.imgs[k-1];o.imgs[k-1]=o.imgs[k];o.imgs[k]=t;markDirty();renderEditor()}));
    if(k<o.imgs.length-1)a.appendChild(btnS("→",function(){var t=o.imgs[k+1];o.imgs[k+1]=o.imgs[k];o.imgs[k]=t;markDirty();renderEditor()}));
    a.appendChild(btnS("✕",function(){o.imgs.splice(k,1);markDirty();renderEditor()}));
    imgs.appendChild(it);
  });
  body.appendChild(imgBox);
  body.appendChild(dropZone(lang==="es"?"subir o arrastrar imágenes":"upload or drop images",true,function(files){o.imgs=o.imgs||[];addImages(files,o.imgs,renderEditor)}));
}
function btnS(t,fn){var b=document.createElement("button");b.type="button";b.textContent=t;b.addEventListener("click",fn);return b}

  });

/* guardar = publicar nueva versión de la página */
function save(){
  if(!ART||publishing)return;
  var d=new Date();STATE.updated=d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
  var html=serialize();
  if(bytes(html)>MAX_BYTES){msg(lang==="es"?"Supera 16 MB: quita o reduce imágenes.":"Over 16 MB: remove or reduce images.","err");return}
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(STATE))}catch(e){}
  publishing=true;updateHead();msg(lang==="es"?"Publicando…":"Publishing…");
  ART.publish(html).then(function(){
    try{sessionStorage.removeItem(DRAFT_KEY)}catch(e){}
    dirty=false;msg(lang==="es"?"Publicado.":"Published.","ok");
  }).catch(function(err){
    publishing=false;var c=err&&err.code;
    var es={conflict:"Había una versión más nueva; la página se recarga. Tu borrador queda guardado: pulsa «recuperar borrador».",too_large:"La página pesa demasiado: quita o reduce imágenes.",rate_limited:"Demasiados guardados seguidos. Espera un minuto.",not_writer:"Esta cuenta no tiene permiso para guardar.",not_granted:"Esta vista no permite guardar.",invalid_content:"No se pudo guardar el contenido."};
    var en={conflict:"A newer version existed; the page is reloading. Your draft is kept: click “recover draft”.",too_large:"The page is too large: remove or reduce images.",rate_limited:"Too many saves in a row. Wait a minute.",not_writer:"This account cannot save.",not_granted:"This view cannot save.",invalid_content:"The content could not be saved."};
    msg((lang==="es"?es:en)[c]||(lang==="es"?"No se pudo publicar. Inténtalo de nuevo en un momento.":"Could not publish. Try again in a moment."),"err");
    updateHead();
  });
}

$("edit-btn").addEventListener("click",function(){if($("editor").hidden)openEditor();else closeEditor()});
$("recover").addEventListener("click",function(){
  try{var d=JSON.parse(sessionStorage.getItem(DRAFT_KEY));if(d&&d.ramas){STATE=d;buildItems();buildPanels();renderAll();dirty=true;$("recover").hidden=true;openEditor()}}catch(e){}
});

function initEdit(tries){
  tries=tries||0;
  if(!window.claude||!window.claude.use){if(tries<20)setTimeout(function(){initEdit(tries+1)},250);return}
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){
    var art=r[0],user=r[1];if(!art)return;
    var can=user?user.canEdit():Promise.resolve(false);
    return Promise.resolve(can).then(function(ok){
      if(!ok)return;ART=art;$("edit-btn").hidden=false;
      try{var d=sessionStorage.getItem(DRAFT_KEY);if(d){if(d===JSON.stringify(STATE))sessionStorage.removeItem(DRAFT_KEY);else $("recover").hidden=false}}catch(e){}
    });
  }).catch(function(){});
}

layout();renderAll();barcode();kick();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){readColors();draw()});
initEdit();
})();
