# Refresca las tendencias de la obra TENDENCIA cada dos horas (Alejandro Osuna Pacheco).
name: Refrescar TENDENCIA

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tendencias
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger tendencias
        working-directory: tendencia
        run: python motor_tendencias.py || echo "El motor falló; se mantiene el trends.json anterior"
      - name: Guardar si ha cambiado
        run: |
          cp tendencia/trends.json web-alejandro/tendencia/trends.json 2>/dev/null || true
          git config user.name "tendencia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tendencia/trends.json web-alejandro/tendencia/trends.json
          git diff --cached --quiet || (git commit -m "TENDENCIA: tendencias actualizadas" && git pull --rebase && git push)
